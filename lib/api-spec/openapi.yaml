openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Akure Airport Staff Cooperative Society API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: members
  - name: savings
  - name: loans
  - name: store
  - name: transactions
  - name: uploads
  - name: notifications
  - name: audit
  - name: settings
  - name: storage
  - name: dashboard
  - name: broadcasts
  - name: support

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── AUTH / PROFILE ──────────────────────────────────────────────────────────
  /auth/profile:
    get:
      operationId: getProfile
      tags: [auth]
      summary: Get current user profile (member record for current clerk user)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberProfile"
        "404":
          description: Not found

  /auth/step-up/request:
    post:
      operationId: requestStepUpCode
      tags: [auth]
      summary: Email a 6-digit verification code to the current user for step-up auth
      responses:
        "200":
          description: Code emailed
          content:
            application/json:
              schema:
                type: object
                properties:
                  sentTo:
                    type: string
                required: [sentTo]
        "429":
          description: Rate limited

  /auth/step-up/verify:
    post:
      operationId: verifyStepUpCode
      tags: [auth]
      summary: Verify a 6-digit step-up code; on success grants a 10-minute step-up window
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  pattern: "^[0-9]{6}$"
              required: [code]
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]
        "400":
          description: Invalid or expired code

  /auth/step-up/status:
    get:
      operationId: getStepUpStatus
      tags: [auth]
      summary: Check whether the current Clerk session has an active step-up grant
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  active:
                    type: boolean
                required: [active]

  /auth/register:
    post:
      operationId: registerMember
      tags: [auth]
      summary: Self-register a new member (locked until admin activates)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterMemberBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          description: Bad request

  /auth/match-suggestions:
    get:
      operationId: getMatchSuggestions
      tags: [auth]
      summary: Suggest cooperative records matching a name + organization (for signup preview)
      parameters:
        - in: query
          name: fullName
          required: true
          schema:
            type: string
        - in: query
          name: organization
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchSuggestionList"

  # ── MEMBERS ──────────────────────────────────────────────────────────────────
  /members:
    get:
      operationId: listMembers
      tags: [members]
      summary: List all members (Admin+)
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, active, inactive]
        - in: query
          name: organization
          schema:
            type: string
        - in: query
          name: search
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
    post:
      operationId: createMember
      tags: [members]
      summary: Create a member account (Admin+)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMemberBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"

  /members/{id}:
    get:
      operationId: getMember
      tags: [members]
      summary: Get a member by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "404":
          description: Not found
    patch:
      operationId: updateMember
      tags: [members]
      summary: Update member (Admin+)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
    delete:
      operationId: deleteMember
      tags: [members]
      summary: Delete a member (Super Admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                required: [deleted]
        "404":
          description: Not found
        "409":
          description: Cannot delete (has related records)

  # ── ORGANIZATIONS ─────────────────────────────────────────────────────────────
  /organizations:
    get:
      operationId: listOrganizations
      tags: [organizations]
      summary: List organizations (active by default)
      parameters:
        - in: query
          name: includeInactive
          schema: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Organization" }
    post:
      operationId: createOrganization
      tags: [organizations]
      summary: Create a new organization (Admin+)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrganizationBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "400": { description: Bad request }
        "409": { description: Code already exists }

  /organizations/{id}:
    patch:
      operationId: updateOrganization
      tags: [organizations]
      summary: Update an organization's name, description or Excel format (Admin+)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOrganizationBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "404": { description: Not found }

  /organizations/{id}/activate:
    post:
      operationId: activateOrganization
      tags: [organizations]
      summary: Re-activate a deactivated organization (Admin+)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "404": { description: Not found }

  /organizations/{id}/deactivate:
    post:
      operationId: deactivateOrganization
      tags: [organizations]
      summary: Deactivate an organization (it stays in the database but hides from sign-up and assignment)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "404": { description: Not found }
        "409": { description: Cannot deactivate the only active organization }

  /members/bulk-organization:
    post:
      operationId: bulkAssignOrganization
      tags: [members]
      summary: Bulk assign organization tag to members (Admin+)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkOrganizationBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: integer
                required: [updated]

  /members/{id}/activate:
    post:
      operationId: activateMember
      tags: [members]
      summary: Activate a pending member (Admin+)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"

  /members/{id}/deactivate:
    post:
      operationId: deactivateMember
      tags: [members]
      summary: Deactivate a member (Admin+)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"

  /members/pending-signups:
    get:
      operationId: listPendingSignups
      tags: [members]
      summary: List app sign-ups awaiting admin approval/match (Admin+)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PendingSignup"

  /cooperative-records:
    get:
      operationId: listCooperativeRecords
      tags: [members]
      summary: List cooperative records not yet linked to an app account (Admin+)
      parameters:
        - in: query
          name: search
          required: false
          schema:
            type: string
        - in: query
          name: organization
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"

  /members/{id}/approve-match:
    post:
      operationId: approveMatch
      tags: [members]
      summary: Approve a pending sign-up, optionally linking it to a cooperative record (Admin+, step-up)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveMatchBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "403": { description: Step-up reverification required }
        "404": { description: Pending sign-up or cooperative record not found }

  /members/{id}/reject-match:
    post:
      operationId: rejectMatch
      tags: [members]
      summary: Reject a pending sign-up (Admin+, step-up)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  rejected:
                    type: boolean
                required: [rejected]
        "403": { description: Step-up reverification required }
        "404": { description: Pending sign-up not found }

  /members/{id}/summary:
    get:
      operationId: getMemberSummary
      tags: [members]
      summary: Get member financial summary
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberSummary"

  # ── OPENING BALANCES ─────────────────────────────────────────────────────────
  /opening-balances:
    get:
      operationId: listOpeningBalances
      tags: [opening-balances]
      summary: List opening-balance holding rows (Admin+)
      parameters:
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [unclaimed, claimed, needs_reconcile]
        - in: query
          name: search
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpeningBalance"

  /members/{id}/opening-balance-suggestion:
    get:
      operationId: getOpeningBalanceSuggestion
      tags: [opening-balances]
      summary: Suggest unclaimed opening-balance rows matching a member by name (Admin+)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpeningBalanceSuggestion"

  /members/{id}/claim-opening-balance:
    post:
      operationId: claimOpeningBalance
      tags: [opening-balances]
      summary: Apply an opening-balance row to a member and activate them (Admin+, step-up)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpeningBalanceClaimInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "403": { description: Step-up reverification required }
        "404": { description: Member or opening balance not found }
        "409": { description: Opening balance already claimed }

  /opening-balances/{id}/reconcile:
    post:
      operationId: reconcileOpeningBalance
      tags: [opening-balances]
      summary: Resolve a flagged opening-balance row by discarding it (Admin+, step-up)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpeningBalance"
        "404": { description: Opening balance not found }

  # ── SAVINGS ──────────────────────────────────────────────────────────────────
  /savings/my:
    get:
      operationId: getMySavings
      tags: [savings]
      summary: Get current member savings balance
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavingsBalance"

  /savings/{memberId}:
    get:
      operationId: getMemberSavings
      tags: [savings]
      summary: Get savings balance for a member (Admin+)
      parameters:
        - in: path
          name: memberId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavingsBalance"

  # ── TRANSACTIONS ─────────────────────────────────────────────────────────────
  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      summary: List all transactions (Admin+)
      parameters:
        - in: query
          name: memberId
          schema:
            type: integer
        - in: query
          name: type
          schema:
            type: string
            enum: [savings, loan_repayment, store_repayment]
        - in: query
          name: month
          schema:
            type: string
        - in: query
          name: year
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"

  /transactions/my:
    get:
      operationId: listMyTransactions
      tags: [transactions]
      summary: List current member's transactions
      parameters:
        - in: query
          name: type
          schema:
            type: string
            enum: [savings, loan_repayment, store_repayment]
        - in: query
          name: year
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"

  # ── EXCEL UPLOAD ─────────────────────────────────────────────────────────────
  /uploads/excel/sheets:
    post:
      operationId: listExcelSheets
      tags: [uploads]
      summary: List sheet names in an uploaded Excel file (Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExcelSheetsBody"
      responses:
        "200":
          description: Sheet listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExcelSheetsResult"

  /uploads/excel/preview:
    post:
      operationId: previewExcelUpload
      tags: [uploads]
      summary: Preview an Excel upload before processing (Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExcelUploadPreviewBody"
      responses:
        "200":
          description: Preview result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExcelUploadPreview"

  /uploads/excel/process:
    post:
      operationId: processExcelUpload
      tags: [uploads]
      summary: Process a validated Excel upload (Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExcelUploadProcessBody"
      responses:
        "200":
          description: Processing result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExcelUploadResult"

  /uploads/history:
    get:
      operationId: listUploadHistory
      tags: [uploads]
      summary: List past Excel uploads (Admin+)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UploadRecord"

  /opening-balances/imports:
    get:
      operationId: listOpeningBalanceImports
      tags: [opening-balances]
      summary: List opening-balance import runs with stats (Admin+)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpeningBalanceImport"

  /members/{id}/balance-timeline:
    get:
      operationId: getMemberBalanceTimeline
      tags: [members]
      summary: Member balance timeline from opening balance through monthly deductions (Admin+)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberBalanceTimeline"
        "404":
          description: Member not found

  # ── LOANS ────────────────────────────────────────────────────────────────────
  /loans:
    get:
      operationId: listLoans
      tags: [loans]
      summary: List all loans (Admin+)
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, admin_approved, auditor_approved, super_admin_approved, disbursed, rejected]
        - in: query
          name: memberId
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Loan"
    post:
      operationId: createLoan
      tags: [loans]
      summary: Apply for a loan (Member)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLoanBody"
      responses:
        "201":
          description: Loan application created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Loan"

  /loans/my:
    get:
      operationId: listMyLoans
      tags: [loans]
      summary: List current member's loans
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Loan"

  /loans/calculate:
    post:
      operationId: calculateLoan
      tags: [loans]
      summary: Calculate loan repayment preview (any authenticated user)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoanCalculateBody"
      responses:
        "200":
          description: Calculation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanCalculation"

  /loans/{id}:
    get:
      operationId: getLoan
      tags: [loans]
      summary: Get a single loan
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Loan"
        "404":
          description: Not found

  /loans/{id}/approve:
    post:
      operationId: approveLoan
      tags: [loans]
      summary: Approve a loan (role-dependent stage)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoanActionBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Loan"

  /loans/{id}/fast-track-approve:
    post:
      operationId: fastTrackApproveLoan
      tags: [loans]
      summary: Super-admin override that approves a loan in one step, bypassing admin and auditor stages.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoanActionBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Loan"

  /loans/{id}/reject:
    post:
      operationId: rejectLoan
      tags: [loans]
      summary: Reject a loan
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoanActionBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Loan"

  /loans/{id}/disburse:
    post:
      operationId: disburseLoan
      tags: [loans]
      summary: Mark loan as disbursed (Treasurer)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoanActionBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Loan"

  /loans/{id}/repayments:
    get:
      operationId: getLoanRepayments
      tags: [loans]
      summary: Get repayment history for a loan
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"

  # ── LOAN PRODUCTS ─────────────────────────────────────────────────────────────
  /loan-products:
    get:
      operationId: listLoanProducts
      tags: [loanProducts]
      summary: List configurable loan products
      parameters:
        - in: query
          name: includeInactive
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LoanProduct"
    post:
      operationId: createLoanProduct
      tags: [loanProducts]
      summary: Create a loan product (Admin)
      requestBody:
